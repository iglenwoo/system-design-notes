<svg xmlns="http://www.w3.org/2000/svg" width="1296.8" height="733.0" viewBox="20 -10 1296.8 733.0"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M9,1 L0,5 L9,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect x="20" y="-10" width="1296.8" height="733.0" fill="#ffffff"/><text x="60" y="50.28" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="26" fill="#1e40af" text-anchor="start" xml:space="preserve">The write axis is a question about the ack</text>
<text x="60" y="80.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="start" xml:space="preserve">Where the durable write sits relative to the acknowledgement — and what that leaves in the cache.</text>
<text x="330" y="137.36" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="start" xml:space="preserve">request arrives                                                                                                    later</text>
<path d="M330,215 L1090,215" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="200.82" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="19" fill="#1e40af" text-anchor="start" xml:space="preserve">write-around</text>
<text x="60" y="222.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" xml:space="preserve">sync  ·  invalidate</text>
<ellipse cx="520.0" cy="215.0" rx="7.0" ry="7.0" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="520.0" y="240.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" xml:space="preserve">UPDATE + commit</text>
<ellipse cx="700.0" cy="215.0" rx="7.0" ry="7.0" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1"/>
<text x="700.0" y="240.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a5f" text-anchor="middle" xml:space="preserve">DEL key</text>
<path d="M840,187 L840,243" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840.0" y="174.7" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#c2410c" text-anchor="middle" xml:space="preserve">ACK</text>
<text x="1120" y="202.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#374151" text-anchor="start" xml:space="preserve">next read: MISS</text>
<text x="1120" y="220.42" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#374151" text-anchor="start" xml:space="preserve">reload from the DB</text>
<path d="M330,375 L1090,375" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="360.82" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="19" fill="#1e40af" text-anchor="start" xml:space="preserve">write-through</text>
<text x="60" y="382.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" xml:space="preserve">sync  ·  populate</text>
<ellipse cx="520.0" cy="375.0" rx="7.0" ry="7.0" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="520.0" y="400.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" xml:space="preserve">INSERT + commit</text>
<ellipse cx="700.0" cy="375.0" rx="7.0" ry="7.0" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1"/>
<text x="700.0" y="400.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a5f" text-anchor="middle" xml:space="preserve">SET key</text>
<path d="M840,347 L840,403" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840.0" y="334.7" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#c2410c" text-anchor="middle" xml:space="preserve">ACK</text>
<text x="1120" y="362.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#374151" text-anchor="start" xml:space="preserve">next read: HIT</text>
<text x="1120" y="380.42" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#374151" text-anchor="start" xml:space="preserve">guaranteed fresh</text>
<path d="M330,555 L1090,555" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M520,555 L920,555" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16,16"/>
<text x="60" y="540.82" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="19" fill="#1e40af" text-anchor="start" xml:space="preserve">write-behind</text>
<text x="60" y="562.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" xml:space="preserve">async  ·  populate</text>
<ellipse cx="430.0" cy="555.0" rx="7.0" ry="7.0" fill="#3b82f6" stroke="#1e3a5f" stroke-width="1"/>
<text x="430.0" y="580.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a5f" text-anchor="middle" xml:space="preserve">RPUSH to buffer</text>
<path d="M520,527 L520,583" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="520.0" y="514.7" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#c2410c" text-anchor="middle" xml:space="preserve">ACK</text>
<ellipse cx="920.0" cy="555.0" rx="7.0" ry="7.0" fill="#047857" stroke="#047857" stroke-width="1"/>
<text x="920.0" y="580.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" xml:space="preserve">batch INSERT</text>
<text x="920.0" y="596.39" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" xml:space="preserve">up to 2s later</text>
<text x="730.0" y="513.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" xml:space="preserve">the only copy lives in Redis</text>
<text x="1120" y="542.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#374151" text-anchor="start" xml:space="preserve">next read: HIT</text>
<text x="1120" y="560.42" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#374151" text-anchor="start" xml:space="preserve">DB lags by one flush</text>
<text x="60" y="658.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">Write latency is the distance from the left edge to the orange tick. Write-behind wins it by acking before the data is durable —</text>
<text x="60" y="676.42" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">the red span is the window in which a Redis failure loses those writes outright. That is the entire trade, drawn to scale.</text></svg>
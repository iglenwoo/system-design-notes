<text x="300" y="632.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">Every one of these can hit any cell above. They are not a seventh strategy —</text>

<text x="425.0" y="210.04" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="18" fill="#1e40af" text-anchor="middle" xml:space="preserve">write-around</text>

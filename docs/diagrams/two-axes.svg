<svg xmlns="http://www.w3.org/2000/svg" width="1020.8000000000002" height="682.0" viewBox="40 15 1020.8000000000002 682.0"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M9,1 L0,5 L9,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect x="40" y="15" width="1020.8000000000002" height="682.0" fill="#ffffff"/><text x="80" y="76.84" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="28" fill="#1e40af" text-anchor="start" xml:space="preserve">A caching strategy is one read choice times one write choice</text>
<text x="80" y="111.26" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="17" fill="#64748b" text-anchor="start" xml:space="preserve">Not five alternatives on one list. Two independent decisions, made per entity.</text>
<text x="320" y="169.7" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#3b82f6" text-anchor="start" xml:space="preserve">WRITE AXIS   —   when does the DB get written, relative to the ack?</text>
<text x="80" y="169.7" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#3b82f6" text-anchor="start" xml:space="preserve">READ AXIS</text>

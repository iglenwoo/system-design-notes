<text x="655.0" y="210.04" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="18" fill="#1e40af" text-anchor="middle" xml:space="preserve">write-through</text>
<text x="655.0" y="232.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" xml:space="preserve">sync  ·  populate</text>
<text x="885.0" y="210.04" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="18" fill="#1e40af" text-anchor="middle" xml:space="preserve">write-behind</text>

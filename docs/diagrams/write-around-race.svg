<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="921.0" viewBox="20 -10 1120 921.0"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M9,1 L0,5 L9,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect x="20" y="-10" width="1120" height="921.0" fill="#ffffff"/><text x="60" y="50.28" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="26" fill="#1e40af" text-anchor="start" xml:space="preserve">Why write-around deletes instead of updating</text>
<text x="60" y="80.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="start" xml:space="preserve">Two writers. Same four events, same order. Only the cache operation differs.</text>
<text x="60" y="136.82" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="19" fill="#dc2626" text-anchor="start" xml:space="preserve">SET the new value</text>
<path d="M280,210 L1080,210" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="210.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#6d28d9" text-anchor="start" xml:space="preserve">writer A</text>
<path d="M280,310 L1080,310" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="310.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#c2410c" text-anchor="start" xml:space="preserve">writer B</text>
<text x="1100" y="331.36" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end" xml:space="preserve">time</text>
<ellipse cx="400.0" cy="210.0" rx="7.0" ry="7.0" fill="#6d28d9" stroke="#6d28d9" stroke-width="1"/>
<text x="400.0" y="168.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" xml:space="preserve">1   UPDATE -&gt; A</text>
<text x="400.0" y="184.39" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" xml:space="preserve">     commits</text>
<ellipse cx="540.0" cy="310.0" rx="7.0" ry="7.0" fill="#c2410c" stroke="#c2410c" stroke-width="1"/>
<text x="540.0" y="334.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" xml:space="preserve">2   UPDATE -&gt; B</text>
<text x="540.0" y="350.39" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" xml:space="preserve">     commits</text>
<ellipse cx="760.0" cy="310.0" rx="7.0" ry="7.0" fill="#c2410c" stroke="#c2410c" stroke-width="1"/>
<text x="760.0" y="334.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" xml:space="preserve">3   SET cache = B</text>
<ellipse cx="900.0" cy="210.0" rx="7.0" ry="7.0" fill="#6d28d9" stroke="#6d28d9" stroke-width="1"/>
<text x="900.0" y="168.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" xml:space="preserve">4   SET cache = A</text>
<text x="900.0" y="184.39" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" xml:space="preserve">     (A was delayed)</text>
<rect x="280" y="382" width="800" height="54" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="680.0" y="411.325" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="middle" xml:space="preserve">DB holds B.   Cache serves A.   Wrong until the TTL expires.</text>
<text x="60" y="506.82" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="19" fill="#047857" text-anchor="start" xml:space="preserve">DELETE the key</text>
<path d="M280,580 L1080,580" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="580.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#6d28d9" text-anchor="start" xml:space="preserve">writer A</text>
<path d="M280,680 L1080,680" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="680.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#c2410c" text-anchor="start" xml:space="preserve">writer B</text>
<text x="1100" y="701.36" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="end" xml:space="preserve">time</text>
<ellipse cx="400.0" cy="580.0" rx="7.0" ry="7.0" fill="#6d28d9" stroke="#6d28d9" stroke-width="1"/>
<text x="400.0" y="538.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" xml:space="preserve">1   UPDATE -&gt; A</text>
<text x="400.0" y="554.39" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" xml:space="preserve">     commits</text>
<ellipse cx="540.0" cy="680.0" rx="7.0" ry="7.0" fill="#c2410c" stroke="#c2410c" stroke-width="1"/>
<text x="540.0" y="704.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" xml:space="preserve">2   UPDATE -&gt; B</text>
<text x="540.0" y="720.39" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" xml:space="preserve">     commits</text>
<ellipse cx="760.0" cy="680.0" rx="7.0" ry="7.0" fill="#c2410c" stroke="#c2410c" stroke-width="1"/>
<text x="760.0" y="704.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#c2410c" text-anchor="middle" xml:space="preserve">3   DEL key</text>
<ellipse cx="900.0" cy="580.0" rx="7.0" ry="7.0" fill="#6d28d9" stroke="#6d28d9" stroke-width="1"/>
<text x="900.0" y="538.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" xml:space="preserve">4   DEL key</text>
<text x="900.0" y="554.39" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" xml:space="preserve">     (A was delayed)</text>
<rect x="280" y="752" width="800" height="54" rx="12" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
<text x="680.0" y="781.325" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="middle" xml:space="preserve">Key absent either way.   Next read reloads B.   Order cannot matter.</text>
<text x="60" y="846.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">SET carries the writers&#x27; order into the cache, and that order can invert. DELETE carries no value, so there is nothing to invert —</text>
<text x="60" y="864.42" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">whoever deletes last still leaves the key absent. Deletion is idempotent; assignment is not.</text></svg>
<text x="330.0" y="183.325" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" xml:space="preserve">user:42   —   TTL expired at t = 0</text>

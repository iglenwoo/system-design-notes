<text x="970.0" y="400.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" xml:space="preserve">per key</text>
<path d="M1040,390 L1130,390" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="1085.0" y="362.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" xml:space="preserve">exactly one</text>
<rect x="1130" y="350" width="160" height="80" rx="12" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
<text x="1210.0" y="392.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#374151" text-anchor="middle" xml:space="preserve">MySQL</text>
<text x="1140.0" y="571.7" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" xml:space="preserve">1 SELECT</text>
<text x="1140.0" y="590.45" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" xml:space="preserve">999 requests wait and share</text>
<text x="1140.0" y="609.2" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" xml:space="preserve">the leader&#x27;s result</text>
<text x="60" y="670.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">The gate is per-process, so N app processes still send N queries — better, not solved. A Redis SET NX EX lock collapses it across the fleet.</text>
<text x="60" y="688.42" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">But reach for TTL jitter first: keys warmed together expire together, and smearing their expiry costs one line and prevents the herd from</text>
<text x="60" y="705.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">forming at all. Single-flight is for the keys hot enough to stampede on their own.</text></svg>
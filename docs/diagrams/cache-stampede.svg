<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="762.5" viewBox="20 -10 1310 762.5"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M9,1 L0,5 L9,9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect x="20" y="-10" width="1310" height="762.5" fill="#ffffff"/><text x="60" y="50.28" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="26" fill="#1e40af" text-anchor="start" xml:space="preserve">Cache stampede: count the arrows reaching MySQL</text>
<text x="60" y="80.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="start" xml:space="preserve">One hot key expires. Every in-flight request misses in the same instant — and each one is holding a DB connection.</text>

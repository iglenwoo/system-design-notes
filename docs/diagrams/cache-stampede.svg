<text x="480.0" y="590.45" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" xml:space="preserve">connection pool exhausted</text>

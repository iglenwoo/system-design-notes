<text x="980.0" y="557.48" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="16" fill="#374151" text-anchor="middle" xml:space="preserve">MySQL</text>
<path d="M980,220 L980,310" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>

<path d="M980,380 L980,520" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="992" y="496.14" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" xml:space="preserve">2   the CACHE issues the SELECT</text>
<text x="100" y="651.7" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" xml:space="preserve">THREE arrows leave the app.</text>
<text x="100" y="670.45" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" xml:space="preserve">Every call site must know the DB, the key</text>
<text x="100" y="689.2" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" xml:space="preserve">format, the TTL, and when to write back.</text>
<text x="740" y="651.7" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" xml:space="preserve">ONE arrow leaves the app.</text>
<text x="740" y="670.45" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" xml:space="preserve">Policy lives in exactly one place, so no</text>
<text x="740" y="689.2" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="15" fill="#374151" text-anchor="start" xml:space="preserve">call site is able to get it wrong.</text>
<text x="100" y="737.92" font-family="-apple-system, BlinkMacSystemFont, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="start" xml:space="preserve">Redis cannot do this natively — it has no MySQL connector. App-level read-through means a wrapper that owns the loader.</text></svg>